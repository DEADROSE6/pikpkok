<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ClipTok</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><span>Para ti</span></header>

  <main id="feed" class="feed" aria-live="polite">
    <p class="empty" id="empty">Cargando videos…</p>
  </main>

  <nav class="bottombar">
    <button id="btn-refresh" title="Recargar">🏠<small>Inicio</small></button>
    <button id="btn-camera" class="cam" title="Abrir cámara">📷</button>
    <label class="upload-label" title="Subir un video">📁<small>Subir</small>
      <input id="file-input" type="file" accept="video/*" hidden>
    </label>
  </nav>

  <!-- Modal de cámara / publicación -->
  <div id="modal" class="modal" hidden>
    <div class="modal-body">
      <video id="preview" autoplay muted playsinline></video>
      <div class="modal-top">
        <button id="btn-close">✕</button>
        <button id="btn-flip">🔄</button>
      </div>
      <div class="modal-bottom">
        <input id="caption" type="text" maxlength="120" placeholder="Escribe una descripción…" hidden>
        <div class="controls">
          <button id="btn-record" class="rec" title="Grabar"></button>
          <button id="btn-publish" class="publish" hidden>Publicar</button>
          <button id="btn-retake" class="retake" hidden>Repetir</button>
        </div>
        <p id="status" class="status"></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
